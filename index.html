<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دروس الشيخ محمد عبدالعظيم الباز</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0E1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دروس الشيخ">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0E1B2A; --card:#16273B; --line:#22374F; --ink:#E8EEF5; --soft:#93A8BF;
  --gold:#D9BA76; --gold-d:#9A8043; --acc:#6FA8DC; --r:16px;
}
[data-theme="light"]{
  --bg:#F5F7FA; --card:#FFFFFF; --line:#E1E7EE; --ink:#1B2733; --soft:#647587;
  --gold:#96762E; --gold-d:#C4AC72; --acc:#2C5B85;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:170px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hide{display:none!important}
button,input,select,textarea{font-family:inherit;color:inherit}
h1{font-family:Amiri,serif;font-size:22px;margin:0;color:var(--gold)}
.sub{font-size:11.5px;color:var(--soft);margin-top:2px}

header{padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:15px;cursor:pointer;display:grid;place-items:center;flex:none}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;font-size:14.5px;margin-bottom:10px}

/* resume banner */
.resume{background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--gold) 14%,var(--card)));
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;cursor:pointer}
.resume .k{font-size:11px;color:var(--soft)}
.resume .v{font-size:15px;margin-top:3px}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}

/* cards */
.cat{margin-top:16px}
.cat h2{font-size:14px;color:var(--gold);margin:0 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;
  border-top:1px solid var(--line);cursor:pointer}
.srow:first-child{border-top:0}
.srow:active{background:var(--line)}
.srow .t{font-size:14.5px;line-height:1.5}
.srow .m{font-size:11px;color:var(--soft);margin-top:3px}
.pill{font-size:11px;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.on{color:var(--gold);border-color:var(--gold-d)}

/* lesson rows */
.lrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:9px;align-items:center;
  padding:12px 13px;border-top:1px solid var(--line);cursor:pointer}
.lrow:first-child{border-top:0}
.lnum{width:30px;height:30px;border-radius:9px;border:1px solid var(--gold-d);color:var(--gold);
  display:grid;place-items:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.lrow.playing{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.lrow.done .lnum{border-color:var(--acc);color:var(--acc)}
.mini{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:9px;
  padding:5px 8px;font-size:11px;cursor:pointer}
.mini.on{color:var(--acc);border-color:var(--acc)}

.back{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:10px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;margin-bottom:10px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.hero h3{margin:0 0 6px;font-family:Amiri,serif;font-size:21px;color:var(--gold)}
.hero p{margin:0;font-size:12.5px;color:var(--soft);line-height:1.8}
.hero .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hero .acts button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  padding:8px 13px;font-size:12.5px;cursor:pointer}
.hero .acts .go{background:var(--gold);border-color:var(--gold);color:#0E1B2A;font-weight:600}

/* notes */
.note-row{padding:11px 13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:10px;align-items:flex-start;cursor:pointer}
.note-row .tm{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.note-row .tx{font-size:13.5px;line-height:1.7}

/* player */
.player{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:9px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.player .in{max-width:560px;margin:0 auto;padding:0 14px}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ptitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:10.5px;color:var(--soft)}
.ptime{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--gold);margin:6px 0 2px}
.pbtns{display:flex;justify-content:center;align-items:center;gap:12px}
.pbtns button{border:0;background:transparent;color:var(--ink);font-size:17px;cursor:pointer;
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.pbtns .main{background:var(--gold);color:#0E1B2A;width:50px;height:50px;font-size:21px}
.prow2{display:flex;gap:6px;justify-content:center;margin-top:7px;flex-wrap:wrap}
.prow2 button{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;
  padding:5px 10px;font-size:11px;cursor:pointer}
.prow2 button.on{border-color:var(--gold);color:var(--gold)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;align-items:end;z-index:40}
.sheet .box{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:0 auto;
  max-height:86vh;overflow:auto;padding-bottom:20px}
.sh{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;font-size:14px;font-weight:600;color:var(--gold)}
.field{padding:13px 15px;border-top:1px solid var(--line)}
label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:7px}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font-size:14.5px}
textarea{min-height:80px;resize:vertical}
.primary{width:100%;padding:12px;border-radius:12px;border:0;background:var(--gold);color:#0E1B2A;
  font-size:14.5px;font-weight:600;cursor:pointer}
.ghost{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font-size:13.5px;cursor:pointer;margin-top:8px}
.toast{position:fixed;bottom:190px;inset-inline:0;text-align:center;font-size:12.5px;color:var(--gold);
  opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;
  padding:7px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:#0E1B2A}
.empty{padding:22px 15px;text-align:center;color:var(--soft);font-size:13px;line-height:1.9}
</style>

<div class="wrap">
<header>
  <div><h1 id="sh-name">دروس الشيخ</h1><div class="sub" id="sh-bio"></div></div>
  <div style="display:flex;gap:7px">
    <button class="icon" id="b-theme">◐</button>
    <button class="icon" id="b-about">ℹ</button>
    <button class="icon" id="b-set">⚙</button>
  </div>
</header>

<!-- ===== HOME ===== -->
<div id="v-home">
  <div class="resume hide" id="resume"></div>
  <input class="search" id="q" placeholder="ابحث عن سلسلة أو درس…">
  <div class="tabs" id="tabs"></div>
  <div id="home-list"></div>
</div>

<!-- ===== SERIES ===== -->
<div id="v-series" class="hide">
  <button class="back" id="b-back-home">← رجوع</button>
  <div class="hero">
    <h3 id="s-name"></h3>
    <p id="s-desc"></p>
    <div class="bar"><i id="s-bar" style="width:0%"></i></div>
    <div class="acts">
      <button class="go" id="s-play">▶ ابدأ الاستماع</button>
      <button id="s-fav">☆ حفظ</button>
      <button id="s-dl">⤓ تحميل الكل</button>
    </div>
  </div>
  <div class="card" id="lessons"></div>
</div>

<!-- ===== SAVED / DOWNLOADS ===== -->
<div id="v-saved" class="hide">
  <button class="back" id="b-back-home2">← رجوع</button>
  <div class="card" id="saved-list"></div>
</div>

<!-- ===== NOTES ===== -->
<div id="v-notes" class="hide">
  <button class="back" id="b-back-home3">← رجوع</button>
  <div class="card" id="notes-list"></div>
</div>
</div>

<div class="player">
  <div class="in">
    <div class="ptop">
      <div style="min-width:0">
        <div class="ptitle" id="p-title">اختر درسًا</div>
        <div class="psub" id="p-sub"></div>
      </div>
      <span class="ptime" id="p-time">0:00 / 0:00</span>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="pbtns">
      <button id="b-next">⏭</button>
      <button id="b-back">−١٥</button>

<audio id="au" preload="metadata"></audio>
<div class="toast" id="toast"></div>

<!-- settings -->
<div class="sheet hide" id="set-sheet"><div class="box">
  <div class="sh"><span>الإعدادات</span><button class="icon" id="close-set" style="width:30px;height:30px">✕</button></div>
  <div class="field"><label>مدة القفز (ثانية)</label><input type="number" id="jump" value="15" min="5" max="60"></div>
  <div class="field">
    <label>ملف المحتوى (للمشرف)</label>
    <button class="ghost" id="imp-content">استيراد content.json</button>
    <button class="ghost" id="exp-content">تصدير المحتوى الحالي</button>
    <input type="file" id="content-file" accept="application/json" class="hide">
  </div>
  <div class="field">
    <label>البيانات</label>
    <button class="ghost" id="exp-data">تصدير تقدّمي وملاحظاتي</button>
    <button class="ghost" id="imp-data">استيراد</button>
    <input type="file" id="data-file" accept="application/json" class="hide">
    <button class="ghost" id="clear-dl">حذف الدروس المحمّلة</button>

</div></div>

<!-- about -->
<div class="sheet hide" id="about-sheet"><div class="box">
  <div class="sh"><span>عن التطبيق</span><button class="icon" id="close-about" style="width:30px;height:30px">✕</button></div>
  <div class="field" id="about-body"></div>
</div></div>

<!-- note editor -->
<div class="sheet hide" id="note-sheet"><div class="box">
  <div class="sh"><span id="note-head">ملاحظة</span><button class="icon" id="close-note" style="width:30px;height:30px">✕</button></div>
  <div class="field"><textarea id="note-text" placeholder="اكتب ملاحظتك…"></textarea></div>
  <div class="field"><button class="primary" id="save-note">حفظ الملاحظة</button></div>
</div></div>

<script>
/* ================= storage ================= */
const store={
 async get(k){ if(window.storage){try{const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null}catch{return null}}
   const v=localStorage.getItem(k);return v?JSON.parse(v):null },
 async set(k,v){ if(window.storage){try{await window.storage.set(k,JSON.stringify(v),false);return}catch{}}
   localStorage.setItem(k,JSON.stringify(v)) }
};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500)};
const AR=n=>Number(n).toLocaleString('ar-EG');
const mmss=s=>{if(!isFinite(s)||s<0)return '0:00';s=Math.floor(s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

/* ================= state ================= */
let DATA={sheikh:{},categories:[],series:[]}, cfg={jump:15,speed:1,theme:'dark'},
  prog={}, notes={}, favs=[], dlSet=new Set(),
  curS=null, curL=-1, catFilter='', sleepT=null, view='home';
const au=document.getElementById('au');
const CACHE='durus-audio';
const SPEEDS=[0.8,1,1.25,1.5,1.75,2];

const S=id=>DATA.series.find(x=>x.id===id);
const lessonUrl=(s,l)=> l.url ? l.url : (s.base||'').replace(/\/?$/,'/')+l.f;
const key=(sid,i)=>sid+':'+i;

/* ================= offline ================= */
async function refreshDl(){ dlSet=new Set();
  try{ const c=await caches.open(CACHE); (await c.keys()).forEach(r=>dlSet.add(r.url)) }catch{} }
async function dl(s,l){
  const u=lessonUrl(s,l); if(!u){toast('لا يوجد رابط لهذا الدرس');return}
  toast('جارٍ التحميل…');
  try{ const c=await caches.open(CACHE); const res=await fetch(u,{mode:'cors'});
    if(!res.ok) throw 0; await c.put(u,res.clone()); dlSet.add(u);
    renderLessons(); toast('تم التحميل ✓') }catch{ toast('تعذّر التحميل') } }
async function srcFor(u){
  try{ const c=await caches.open(CACHE); const h=await c.match(u);
    if(h){ return URL.createObjectURL(await h.blob()) } }catch{}
  return u; }

/* ================= player ================= */
async function play(sid,i,at){
  const s=S(sid); if(!s||!s.lessons[i]) return;
  curS=sid; curL=i; const l=s.lessons[i];
  const u=lessonUrl(s,l);
  if(!u){ toast('هذا الدرس لم يُرفع بعد'); return }
  document.getElementById('p-title').textContent=l.t;
  document.getElementById('p-sub').textContent=s.name;
  au.src=await srcFor(u); au.playbackRate=cfg.speed||1;
  const p=prog[key(sid,i)];
  au.currentTime = at!=null ? at : (p&&p.t&&!p.done ? p.t : 0);
  try{ await au.play() }catch{}
  media(l.t,s.name);
  await store.set('last',{sid,i,t:au.currentTime});
  renderLessons(); renderResume();
}
function media(t,a){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:DATA.sheikh.name||'',album:a,
    artwork:[{src:'./icon-512.png',sizes:'512x512',type:'image/png'}]});
  const h=navigator.mediaSession.setActionHandler.bind(navigator.mediaSession);
  try{ h('play',()=>au.play()); h('pause',()=>au.pause());
    h('previoustrack',()=>step(-1)); h('nexttrack',()=>step(1));
    h('seekbackward',()=>au.currentTime-=+cfg.jump||15);
    h('seekforward',()=>au.currentTime+=+cfg.jump||15) }catch{}
}
function step(d){ if(!curS)return; const s=S(curS);
  const n=curL+d; if(n<0||n>=s.lessons.length){toast('لا يوجد المزيد');return} play(curS,n,0) }

document.getElementById('b-play').onclick=()=>{ if(!au.src){toast('اختر درسًا');return}
  au.paused?au.play():au.pause() };
au.onplay=()=>document.getElementById('b-play').textContent='⏸';
au.onpause=()=>document.getElementById('b-play').textContent='▶';
document.getElementById('b-fwd').onclick=()=>au.currentTime+=+cfg.jump||15;
document.getElementById('b-back').onclick=()=>au.currentTime-=+cfg.jump||15;
document.getElementById('b-next').onclick=()=>step(1);
document.getElementById('b-prev').onclick=()=>step(-1);

const seek=document.getElementById('seek'); let seeking=false;
seek.oninput=()=>seeking=true;
seek.onchange=()=>{ if(au.duration)au.currentTime=au.duration*seek.value/1000; seeking=false };
let tk=0;
au.ontimeupdate=()=>{
  if(au.duration&&!seeking) seek.value=au.currentTime/au.duration*1000;
  document.getElementById('p-time').textContent=mmss(au.currentTime)+' / '+mmss(au.duration);
  if(++tk%20===0&&curS){ const k=key(curS,curL);
    prog[k]=Object.assign({},prog[k],{t:au.currentTime,d:au.duration});
    store.set('prog',prog); store.set('last',{sid:curS,i:curL,t:au.currentTime}); renderResume() }
};
au.onended=()=>{ if(curS){ const k=key(curS,curL);
    prog[k]=Object.assign({},prog[k],{t:0,done:true}); store.set('prog',prog) }
  step(1) };

document.getElementById('b-speed').onclick=async()=>{
  cfg.speed=SPEEDS[(SPEEDS.indexOf(cfg.speed||1)+1)%SPEEDS.length];
  au.playbackRate=cfg.speed; await store.set('cfg',cfg);
  document.getElementById('b-speed').textContent=AR(cfg.speed)+'×' };
document.getElementById('b-sleep').onclick=e=>{
  if(sleepT){clearTimeout(sleepT);sleepT=null;e.target.classList.remove('on');
    e.target.textContent='مؤقّت';toast('أُلغي المؤقّت');return}
  const M=[15,30,45,60]; const c=+(e.target.dataset.m||0);
  const n=M[(M.indexOf(c)+1)%M.length]; e.target.dataset.m=n;
  e.target.classList.add('on'); e.target.textContent='مؤقّت '+AR(n)+'د';
  sleepT=setTimeout(()=>{au.pause();sleepT=null;e.target.classList.remove('on');
    e.target.textContent='مؤقّت'},n*60000) };
document.getElementById('b-dl1').onclick=()=>{ if(!curS)return toast('اختر درسًا');
  dl(S(curS),S(curS).lessons[curL]) };
document.getElementById('b-mark').onclick=async()=>{ if(!curS)return;
  const k=key(curS,curL); prog[k]=Object.assign({},prog[k],{done:!(prog[k]||{}).done});
  await store.set('prog',prog); renderLessons(); renderResume();
  toast(prog[k].done?'تم تعليمه كمسموع ✓':'أُلغي التعليم') };

/* ================= notes ================= */
const noteSheet=document.getElementById('note-sheet');
document.getElementById('b-note').onclick=()=>{ if(!curS)return toast('اختر درسًا');
  document.getElementById('note-head').textContent='ملاحظة عند '+mmss(au.currentTime);
  document.getElementById('note-text').value=''; noteSheet.classList.remove('hide') };
document.getElementById('close-note').onclick=()=>noteSheet.classList.add('hide');
document.getElementById('save-note').onclick=async()=>{
  const t=document.getElementById('note-text').value.trim(); if(!t)return;
  const k=key(curS,curL); (notes[k]=notes[k]||[]).push({t:au.currentTime,x:t});
  notes[k].sort((a,b)=>a.t-b.t); await store.set('notes',notes);
  noteSheet.classList.add('hide'); toast('حُفظت الملاحظة'); renderLessons() };

/* ================= views ================= */
function show(v){ view=v;
  ['home','series','saved','notes'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hide',x!==v));
  scrollTo({top:0,behavior:'smooth'}) }
document.getElementById('b-back-home').onclick=()=>{show('home');renderHome()};
document.getElementById('b-back-home2').onclick=()=>{show('home');renderHome()};
document.getElementById('b-back-home3').onclick=()=>{show('home');renderHome()};

function seriesStats(s){
  const n=s.lessons.length; if(!n)return {n:0,done:0,pct:0};
  let d=0; s.lessons.forEach((_,i)=>{ if((prog[key(s.id,i)]||{}).done)d++ });
  return {n,done:d,pct:Math.round(d/n*100)};
}
function renderResume(){
  const el=document.getElementById('resume');
  store.get('last').then(last=>{
    if(!last||!S(last.sid)||!S(last.sid).lessons[last.i]){el.classList.add('hide');return}
    const s=S(last.sid), l=s.lessons[last.i], p=prog[key(last.sid,last.i)]||{};
    const pct=p.d?Math.min(100,Math.round((p.t||0)/p.d*100)):0;
    el.classList.remove('hide');
    el.innerHTML=`<div class="k">أكمل الاستماع</div><div class="v">${l.t}</div>
      <div class="k" style="margin-top:2px">${s.name}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
    el.onclick=()=>play(last.sid,last.i);
  });
}
function renderTabs(){
  const t=document.getElementById('tabs');
  t.innerHTML=`<button data-c="" aria-current="${catFilter===''}">الكل</button>`+
    DATA.categories.map(c=>`<button data-c="${c.id}" aria-current="${catFilter===c.id}">${c.name}</button>`).join('')+
    `<button data-c="_fav">☆ المحفوظة</button><button data-c="_notes">✎ ملاحظاتي</button>`;
  t.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.c==='_fav'){renderSaved();show('saved');return}
    if(b.dataset.c==='_notes'){renderNotes();show('notes');return}
    catFilter=b.dataset.c; renderTabs(); renderHome() };
}
function renderHome(){
  const q=(document.getElementById('q').value||'').trim();
  const host=document.getElementById('home-list');
  if(q){
    const hits=[];
    DATA.series.forEach(s=>{
      if(s.name.includes(q)) hits.push({s,l:null,i:-1});
      s.lessons.forEach((l,i)=>{ if(l.t.includes(q)) hits.push({s,l,i}) });
    });
    host.innerHTML=hits.length?`<div class="card">`+hits.slice(0,40).map(h=>
      `<div class="srow" data-s="${h.s.id}" data-i="${h.i}">
        <div><div class="t">${h.l?h.l.t:h.s.name}</div>
        <div class="m">${h.l?h.s.name:'سلسلة · '+AR(h.s.lessons.length)+' درسًا'}</div></div>
        <span class="pill">${h.l?'درس':'سلسلة'}</span></div>`).join('')+`</div>`
      :`<div class="card"><div class="empty">لا نتائج لبحثك</div></div>`;
    host.onclick=e=>{const r=e.target.closest('.srow');if(!r)return;
      const i=+r.dataset.i; if(i>=0) play(r.dataset.s,i); else openSeries(r.dataset.s)};
    return;
  }
  const cats=DATA.categories.filter(c=>!catFilter||c.id===catFilter);
  host.innerHTML=cats.map(c=>{
    const list=DATA.series.filter(s=>s.cat===c.id);
    if(!list.length)return '';
    return `<div class="cat"><h2>${c.name}</h2><div class="card">`+list.map(s=>{
      const st=seriesStats(s);
      return `<div class="srow" data-s="${s.id}">
        <div><div class="t">${s.name}</div>
        <div class="m">${st.n?AR(st.n)+' درسًا'+(st.done?' · سمعت '+AR(st.done):''):'قريبًا'}</div></div>
        <span class="pill ${st.pct===100?'on':''}">${st.n?st.pct+'%':'—'}</span></div>`}).join('')+`</div></div>`;
  }).join('');
  host.onclick=e=>{const r=e.target.closest('.srow');if(r)openSeries(r.dataset.s)};
}
document.getElementById('q').oninput=renderHome;

function openSeries(id){
  const s=S(id); if(!s)return; curSeriesId=id;
  document.getElementById('s-name').textContent=s.name;
  document.getElementById('s-desc').textContent=s.desc||(s.lessons.length?AR(s.lessons.length)+' درسًا':'لم تُرفع دروس هذه السلسلة بعد');
  const st=seriesStats(s); document.getElementById('s-bar').style.width=st.pct+'%';
  document.getElementById('s-fav').textContent=favs.includes(id)?'★ محفوظة':'☆ حفظ';
  renderLessons(); show('series');
}
let curSeriesId=null;
function renderLessons(){
  if(!curSeriesId)return; const s=S(curSeriesId);
  const host=document.getElementById('lessons');
  if(!s.lessons.length){ host.innerHTML=`<div class="empty">لم تُرفع دروس هذه السلسلة بعد.<br>ترقّبها قريبًا إن شاء الله.</div>`; return }
  host.innerHTML=s.lessons.map((l,i)=>{
    const p=prog[key(s.id,i)]||{}, u=lessonUrl(s,l), has=dlSet.has(u);
    const nc=(notes[key(s.id,i)]||[]).length;
    return `<div class="lrow ${s.id===curS&&i===curL?'playing':''} ${p.done?'done':''}" data-i="${i}">
      <span class="lnum">${p.done?'✓':AR(i+1)}</span>
      <div><div class="t">${l.t}</div>
      <div class="m">${p.d?mmss(p.d):''}${nc?' · ✎ '+AR(nc):''}${p.t&&!p.done?' · توقفت عند '+mmss(p.t):''}</div></div>
      <button class="mini ${has?'on':''}" data-dl="${i}">${has?'✓':'⤓'}</button>
      <button class="mini" data-nt="${i}">✎</button></div>`}).join('');
  host.onclick=e=>{
    const d=e.target.closest('button[data-dl]');
    if(d){e.stopPropagation();dl(s,s.lessons[+d.dataset.dl]);return}
    const n=e.target.closest('button[data-nt]');
    if(n){e.stopPropagation();showNotesFor(s.id,+n.dataset.nt);return}
    const r=e.target.closest('.lrow'); if(r)play(s.id,+r.dataset.i) };
}
document.getElementById('s-play').onclick=()=>{ const s=S(curSeriesId); if(!s||!s.lessons.length)return;
  let i=s.lessons.findIndex((_,k)=>!(prog[key(s.id,k)]||{}).done); if(i<0)i=0; play(s.id,i) };
document.getElementById('s-fav').onclick=async()=>{ const i=favs.indexOf(curSeriesId);
  if(i<0)favs.push(curSeriesId); else favs.splice(i,1);
  await store.set('favs',favs);
  document.getElementById('s-fav').textContent=favs.includes(curSeriesId)?'★ محفوظة':'☆ حفظ' };
document.getElementById('s-dl').onclick=async()=>{ const s=S(curSeriesId);
  if(!s.lessons.length)return; toast('جارٍ تحميل السلسلة…');
  for(const l of s.lessons){ await dl(s,l) } toast('اكتمل تحميل السلسلة ✓') };

function renderSaved(){
  const host=document.getElementById('saved-list');
  const list=favs.map(S).filter(Boolean);
  host.innerHTML=list.length? list.map(s=>{ const st=seriesStats(s);
    return `<div class="srow" data-s="${s.id}"><div><div class="t">${s.name}</div>
      <div class="m">${AR(st.n)} درسًا · ${st.pct}%</div></div><span class="pill">فتح</span></div>`}).join('')
    :`<div class="empty">لم تحفظ أي سلسلة بعد.<br>افتح سلسلة واضغط «حفظ».</div>`;
  host.onclick=e=>{const r=e.target.closest('.srow');if(r)openSeries(r.dataset.s)};
}
function renderNotes(){
  const host=document.getElementById('notes-list'); const out=[];
  Object.entries(notes).forEach(([k,arr])=>{
    const [sid,i]=k.split(':'); const s=S(sid); if(!s||!s.lessons[+i])return;
    arr.forEach(n=>out.push({sid,i:+i,s,l:s.lessons[+i],n}));
  });
  host.innerHTML=out.length? out.map(o=>
    `<div class="note-row" data-s="${o.sid}" data-i="${o.i}" data-t="${o.n.t}">
      <div><div class="tx">${o.n.x}</div><div class="m" style="font-size:11px;color:var(--soft);margin-top:4px">${o.l.t} — ${o.s.name}</div></div>
      <span class="tm">${mmss(o.n.t)}</span></div>`).join('')
    :`<div class="empty">لا ملاحظات بعد.<br>أثناء الاستماع اضغط «✎ ملاحظة» لتدوين فائدة مع توقيتها.</div>`;
  host.onclick=e=>{const r=e.target.closest('.note-row');if(!r)return;
    play(r.dataset.s,+r.dataset.i,+r.dataset.t)};
}
function showNotesFor(sid,i){ renderNotes(); show('notes') }

/* ================= sheets ================= */
const setS=document.getElementById('set-sheet'), abS=document.getElementById('about-sheet');
document.getElementById('b-set').onclick=async()=>{ document.getElementById('jump').value=cfg.jump;
  await refreshDl(); document.getElementById('dl-info').textContent='الدروس المحمّلة: '+AR(dlSet.size);
  setS.classList.remove('hide') };
document.getElementById('close-set').onclick=()=>setS.classList.add('hide');
setS.onclick=e=>{if(e.target===setS)setS.classList.add('hide')};
document.getElementById('jump').onchange=async e=>{cfg.jump=+e.target.value||15;await store.set('cfg',cfg)};
document.getElementById('b-about').onclick=()=>{
  const s=DATA.sheikh||{};
  document.getElementById('about-body').innerHTML=
    `<p style="font-size:14px;line-height:1.9;margin:0 0 12px">${s.bio||''}</p>`+
    (s.telegram?`<button class="ghost" onclick="open('${s.telegram}','_blank')">قناة تليجرام</button>`:'')+
    (s.youtube?`<button class="ghost" onclick="open('${s.youtube}','_blank')">يوتيوب</button>`:'')+
    (s.facebook?`<button class="ghost" onclick="open('${s.facebook}','_blank')">فيسبوك</button>`:'')+
    `<p class="sub" style="margin-top:14px;line-height:1.8">جميع المواد منشورة بإذن الشيخ.
     التطبيق لا يجمع أي بيانات، وكل ما تسجّله محفوظ على جهازك وحدك.</p>`;
  abS.classList.remove('hide') };
document.getElementById('close-about').onclick=()=>abS.classList.add('hide');
abS.onclick=e=>{if(e.target===abS)abS.classList.add('hide')};
document.getElementById('b-theme').onclick=async()=>{ cfg.theme=cfg.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cfg.theme); await store.set('cfg',cfg) };

document.getElementById('imp-content').onclick=()=>document.getElementById('content-file').click();
document.getElementById('content-file').onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
  try{ DATA=JSON.parse(await f.text()); await store.set('content',DATA);
    boot2(); toast('حُدّث المحتوى') }catch{ toast('ملف غير صالح') } };
document.getElementById('exp-content').onclick=()=>dlJson(DATA,'content.json');
document.getElementById('exp-data').onclick=()=>dlJson({prog,notes,favs},'my-progress.json');
document.getElementById('imp-data').onclick=()=>document.getElementById('data-file').click();
document.getElementById('data-file').onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
  try{ const j=JSON.parse(await f.text());
    prog=j.prog||prog; notes=j.notes||notes; favs=j.favs||favs;
    await store.set('prog',prog); await store.set('notes',notes); await store.set('favs',favs);
    renderHome(); toast('تم الاستيراد') }catch{ toast('ملف غير صالح') } };
document.getElementById('clear-dl').onclick=async()=>{ await caches.delete(CACHE); await refreshDl();
  renderLessons(); document.getElementById('dl-info').textContent='الدروس المحمّلة: ٠'; toast('حُذفت') };
function dlJson(o,name){ const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click() }

/* ================= boot ================= */
function boot2(){
  document.getElementById('sh-name').textContent=DATA.sheikh.name||'دروس الشيخ';
  document.getElementById('sh-bio').textContent=DATA.sheikh.bio||'';
  renderTabs(); renderHome(); renderResume();
}
(async function(){
  cfg=Object.assign({jump:15,speed:1,theme:'dark'},await store.get('cfg')||{});
  document.documentElement.setAttribute('data-theme',cfg.theme);
  document.getElementById('b-speed').textContent=AR(cfg.speed)+'×';
  prog=(await store.get('prog'))||{}; notes=(await store.get('notes'))||{};
  favs=(await store.get('favs'))||[];
  try{ DATA=await (await fetch('./content.json?v='+Date.now())).json() }
  catch{ DATA=(await store.get('content'))||DATA }
  await refreshDl(); boot2();
  const last=await store.get('last');
  if(last&&S(last.sid)){ curS=last.sid; curL=last.i;
    const l=S(last.sid).lessons[last.i];
    if(l){ document.getElementById('p-title').textContent=l.t;
      document.getElementById('p-sub').textContent=S(last.sid).name } }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
