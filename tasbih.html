<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com https://api.alquran.cloud https://alquran.cloud https://dorar.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السبحة — عدّاد الذكر</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#173B39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تدارُك">

<style>
@font-face{font-family:'Amiri';src:url('./amiri-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Amiri';src:url('./amiri-700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('./plex-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('./plex-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('./plex-600.woff2') format('woff2');font-weight:600;font-display:swap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
:root,[data-palette="mishkat"][data-theme="light"]{
  --bg:#F8F3E7; --card:#FFFDF9; --line:#D5E1D8; --ink:#173B39; --soft:#63756E;
  --gold:#806A45; --gold-d:#B77860; --green:#173B39; --r:18px;
}
[data-palette="sage"][data-theme="light"]{
  --bg:#F7F8F3; --card:#FFFFFF; --line:#DCE5D4; --ink:#2E3A29; --soft:#66755F;
  --gold:#B08A4A; --gold-d:#C6AC72; --green:#4A6940;
}
[data-theme="dark"]{
  --bg:#0D1A18; --card:#132421; --line:#2C4943; --ink:#F3F1E8; --soft:#B9C7C2;
  --gold:#B7A17A; --gold-d:#C28B78; --green:#95BDB2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:96px;overscroll-behavior:none}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
.hide{display:none!important}
button,select,input{font-family:inherit;color:inherit}

header{padding:calc(14px + env(safe-area-inset-top)) 0 14px;display:flex;align-items:center;justify-content:space-between}
h1{font-family:Amiri,serif;font-size:24px;margin:0;color:var(--gold)}
.icon{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:16px;cursor:pointer;display:grid;place-items:center}
.tools{display:flex;gap:7px}

/* ---------- counter ---------- */
.stage{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px 16px 24px;text-align:center}
.zikr{font-family:Amiri,serif;font-size:26px;line-height:1.6;min-height:44px;color:var(--gold)}
.fadl{font-size:14.5px;color:var(--soft);margin-top:8px;line-height:1.7;min-height:20px}
.src{font-size:13px;color:var(--soft);line-height:1.7;margin-top:5px}.src a{color:var(--gold);text-decoration:none}.row .src{margin-top:5px}
.ring{position:relative;width:250px;height:250px;margin:16px auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.num{font-family:Amiri,serif;font-size:74px;line-height:1;color:var(--ink)}
.of{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.rounds{font-size:13px;color:var(--gold-d)}
.tapzone{margin-top:6px;padding:16px 0;border-radius:18px;border:1px dashed var(--line);
  color:var(--soft);font-size:13px;cursor:pointer}
.tapzone:active{background:var(--line)}
.ctrl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.ctrl button{padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--soft);font-size:13px;cursor:pointer}
.ctrl button.on{border-color:var(--gold);color:var(--gold)}

.targets{display:flex;gap:7px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.targets button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--soft);font-size:13.5px;cursor:pointer}
.targets button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16241E}
.ctrl button,.targets button,.primary,nav button{min-height:44px}

/* ---------- lists ---------- */
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.head{padding:11px 15px;font-size:14px;font-weight:600;color:var(--gold);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}
.row{padding:13px 15px;border-top:1px solid var(--line);cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.row:first-child{border-top:0}
.row:active{background:var(--line)}
.row .t{font-family:Amiri,serif;font-size:19px;line-height:1.5}
.row .c{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sel{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.name99{display:flex;gap:10px;align-items:baseline}
.name99 b{font-family:Amiri,serif;font-size:21px;color:var(--gold);font-weight:400}
.name99 span{font-size:14px;color:var(--soft)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:Amiri,serif;font-size:28px;color:var(--gold);line-height:1.1}
.stat span{font-size:13.5px;color:var(--soft)}
.bars{padding:6px 15px 16px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:9px;align-items:center;font-size:13.5px}
.bar i{height:8px;border-radius:99px;background:var(--gold);display:block}
.bar em{font-style:normal;color:var(--soft);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 15px 16px;text-align:center}
.week div{font-size:11.25px;color:var(--soft)}
.week i{display:block;height:44px;border-radius:8px;background:var(--line);margin-bottom:4px;
  display:grid;place-items:end center;overflow:hidden}
.week i b{display:block;width:100%;background:var(--gold);font-size:0}

nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:7px 0 calc(7px + env(safe-area-inset-bottom))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 12px}
nav button{border:0;background:none;color:var(--soft);font-size:12.75px;padding:7px 0 5px;border-radius:12px;
  cursor:pointer;display:grid;gap:3px;justify-items:center}
nav button em{font-style:normal;font-size:16px}
nav button[aria-current="true"]{color:var(--gold);background:var(--bg)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;align-items:end;z-index:30}
.sheet .box{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:0 auto;
  max-height:86vh;overflow:auto;padding-bottom:22px}
.field{padding:13px 15px;border-top:1px solid var(--line)}
label{display:block;font-size:14px;color:var(--soft);margin-bottom:7px}
input[type=text],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font-size:16px}
.primary{width:100%;padding:12px;border-radius:12px;border:0;background:var(--gold);color:#16241E;
  font-size:14.5px;font-weight:600;cursor:pointer;margin-top:4px}
.toast{position:fixed;bottom:86px;inset-inline:0;text-align:center;font-size:13px;color:var(--gold);
  opacity:0;transition:.3s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
<header>
  <h1 id="title">السبحة</h1>
  <div class="tools">
    <button class="icon" id="b-sound" title="الصوت">♪</button>
    <button class="icon" id="b-vibe" title="الاهتزاز">📳</button>
    <button class="icon" id="b-theme" title="الوضع">◐</button>
  </div>
</header>

<!-- ============ COUNTER ============ -->
<div id="v-count">
  <div class="stage">
    <div class="zikr" id="zikr">سُبْحَانَ اللهِ وَبِحَمْدِهِ</div>
    <div class="fadl" id="fadl"></div>
    <div class="src" id="src"></div>

    <div class="ring" id="ring">
      <svg width="250" height="250" viewBox="0 0 250 250">
        <circle cx="125" cy="125" r="112" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle id="arc" cx="125" cy="125" r="112" fill="none" stroke="var(--gold)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="703" stroke-dashoffset="703"/>
      </svg>
      <div class="mid">
        <div class="num" id="num">0</div>
        <div class="of" id="of">من ٣٣</div>
        <div class="rounds" id="rounds"></div>
      </div>
    </div>

    <div class="tapzone" id="tapzone">اضغط في أي مكان داخل الدائرة أو هنا للتسبيح</div>

    <div class="targets" id="targets"></div>
    <div class="src">تنبيه: أرقام أهداف العدّاد اختيارية للتنظيم، ولا تُنسب للسنة إلا إذا ذكر المصدر عددًا محددًا.</div>

    <div class="ctrl">
      <button id="b-undo">تراجع −١</button>
      <button id="b-reset">تصفير</button>
      <button id="b-seq">تسبيح ما بعد الصلاة</button>
      <button id="b-awake">إبقاء الشاشة</button>
    </div>
  </div>
</div>

<!-- ============ DHIKR LIST ============ -->
<div id="v-list" class="hide">
  <section>
    <div class="head"><span>الأذكار</span>
      <button class="icon" id="b-add" style="width:32px;height:32px;font-size:18px">＋</button></div>
    <div id="list"></div>
  </section>
</div>

<!-- ============ STATS ============ -->
<div id="v-stats" class="hide">
  <section>
    <div class="head">إحصائياتك</div>
    <div class="stats">
      <div class="stat"><b id="s-today">0</b><span>ذكر اليوم</span></div>
      <div class="stat"><b id="s-total">0</b><span>الإجمالي</span></div>
      <div class="stat"><b id="s-streak">0</b><span>أيام متتابعة</span></div>
      <div class="stat"><b id="s-best">0</b><span>أعلى يوم</span></div>
    </div>
    <div class="week" id="week"></div>
  </section>
  <section>
    <div class="head">توزيع الأذكار اليوم</div>
    <div class="bars" id="bars"></div>
  </section>
  <section>
    <div class="head">البيانات</div>
    <div class="field"><button class="primary" id="b-export">تصدير نسخة احتياطية</button></div>
    <div class="field"><button class="primary" id="b-import" style="background:var(--line);color:var(--ink)">استيراد</button>
      <input type="file" id="file-in" accept="application/json" class="hide" aria-label="ملف نسخة السبحة للاستيراد"></div>
  </section>
</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<nav><div>
  <button data-t="count" aria-current="true"><em>◍</em>السبحة</button>
  <button data-t="list"><em>☰</em>الأذكار</button>
  <button data-t="stats"><em>▤</em>إحصائيات</button>
</div></nav>

<!-- add custom dhikr -->
<div class="sheet hide" id="add-sheet"><div class="box" role="dialog" aria-modal="true" aria-labelledby="add-dhikr-title">
  <div class="head"><span id="add-dhikr-title">إضافة ذكر</span><button class="icon" id="close-add" type="button" aria-label="إغلاق إضافة الذكر">✕</button></div>
  <div class="field"><label for="new-text">نص الذكر</label><input type="text" id="new-text" maxlength="280" placeholder="اكتب الذكر…"></div>
  <div class="field"><label for="new-target">العدد المستهدف</label><input type="number" id="new-target" value="33" min="1" max="100000"></div>
  <div class="field"><button class="primary" id="save-new">إضافة</button></div>
</div></div>

<script src="./version.js"></script>
<script src="./storage.js"></script>
<script src="./tasbih.js"></script>
<script src="./a11y-dialogs.js"></script>
<script src="./network-status.js"></script>
<script src="./pwa-register.js"></script>
</body>
</html>
