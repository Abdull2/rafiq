<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السبحة — عدّاد الذكر</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B3A2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رفيق يومك">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
@font-face{font-family:'Amiri';src:url('./amiri-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Amiri';src:url('./amiri-700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('./plex-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('./plex-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans Arabic';src:url('./plex-600.woff2') format('woff2');font-weight:600;font-display:swap}
</style>
<style>
:root{
  --bg:#0E1A16; --card:#16241E; --line:#24352C; --ink:#E8EFE7; --soft:#93A98F;
  --gold:#D2B268; --gold-d:#9A7F3E; --green:#7FB08A; --r:18px;
}
[data-theme="light"]{
  --bg:#F6F8F3; --card:#FFFFFF; --line:#DEE6D8; --ink:#243021; --soft:#6E8168;
  --gold:#A9863C; --gold-d:#C6AC72; --green:#4A6940;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:96px;overscroll-behavior:none}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
.hide{display:none!important}
button,select,input{font-family:inherit;color:inherit}

header{padding:calc(14px + env(safe-area-inset-top)) 0 14px;display:flex;align-items:center;justify-content:space-between}
h1{font-family:Amiri,serif;font-size:24px;margin:0;color:var(--gold)}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:16px;cursor:pointer;display:grid;place-items:center}
.tools{display:flex;gap:7px}

/* ---------- counter ---------- */
.stage{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px 16px 24px;text-align:center}
.zikr{font-family:Amiri,serif;font-size:26px;line-height:1.6;min-height:44px;color:var(--gold)}
.fadl{font-size:12.5px;color:var(--soft);margin-top:8px;line-height:1.7;min-height:20px}
.src{font-size:11px;color:var(--soft);line-height:1.7;margin-top:5px}.src a{color:var(--gold);text-decoration:none}.row .src{margin-top:5px}
.ring{position:relative;width:250px;height:250px;margin:16px auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.num{font-family:Amiri,serif;font-size:74px;line-height:1;color:var(--ink)}
.of{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.rounds{font-size:12px;color:var(--gold-d)}
.tapzone{margin-top:6px;padding:16px 0;border-radius:18px;border:1px dashed var(--line);
  color:var(--soft);font-size:13px;cursor:pointer}
.tapzone:active{background:var(--line)}
.ctrl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.ctrl button{padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--soft);font-size:13px;cursor:pointer}
.ctrl button.on{border-color:var(--gold);color:var(--gold)}

.targets{display:flex;gap:7px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.targets button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--soft);font-size:12.5px;cursor:pointer}
.targets button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16241E}

/* ---------- lists ---------- */
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.head{padding:11px 15px;font-size:14px;font-weight:600;color:var(--gold);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}
.row{padding:13px 15px;border-top:1px solid var(--line);cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.row:first-child{border-top:0}
.row:active{background:var(--line)}
.row .t{font-family:Amiri,serif;font-size:19px;line-height:1.5}
.row .c{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sel{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.name99{display:flex;gap:10px;align-items:baseline}
.name99 b{font-family:Amiri,serif;font-size:21px;color:var(--gold);font-weight:400}
.name99 span{font-size:12.5px;color:var(--soft)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:Amiri,serif;font-size:28px;color:var(--gold);line-height:1.1}
.stat span{font-size:11.5px;color:var(--soft)}
.bars{padding:6px 15px 16px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:9px;align-items:center;font-size:12.5px}
.bar i{height:8px;border-radius:99px;background:var(--gold);display:block}
.bar em{font-style:normal;color:var(--soft);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 15px 16px;text-align:center}
.week div{font-size:10px;color:var(--soft)}
.week i{display:block;height:44px;border-radius:8px;background:var(--line);margin-bottom:4px;
  display:grid;place-items:end center;overflow:hidden}
.week i b{display:block;width:100%;background:var(--gold);font-size:0}

nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:7px 0 calc(7px + env(safe-area-inset-bottom))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 12px}
nav button{border:0;background:none;color:var(--soft);font-size:11.5px;padding:7px 0 5px;border-radius:12px;
  cursor:pointer;display:grid;gap:3px;justify-items:center}
nav button em{font-style:normal;font-size:16px}
nav button[aria-current="true"]{color:var(--gold);background:var(--bg)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;align-items:end;z-index:30}
.sheet .box{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:0 auto;
  max-height:86vh;overflow:auto;padding-bottom:22px}
.field{padding:13px 15px;border-top:1px solid var(--line)}
label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:7px}
input[type=text],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font-size:15px}
.primary{width:100%;padding:12px;border-radius:12px;border:0;background:var(--gold);color:#16241E;
  font-size:14.5px;font-weight:600;cursor:pointer;margin-top:4px}
.toast{position:fixed;bottom:86px;inset-inline:0;text-align:center;font-size:13px;color:var(--gold);
  opacity:0;transition:.3s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
<header>
  <h1 id="title">السبحة</h1>
  <div class="tools">
    <button class="icon" id="b-sound" title="الصوت">♪</button>
    <button class="icon" id="b-vibe" title="الاهتزاز">📳</button>
    <button class="icon" id="b-theme" title="الوضع">◐</button>
  </div>
</header>

<!-- ============ COUNTER ============ -->
<div id="v-count">
  <div class="stage">
    <div class="zikr" id="zikr">سُبْحَانَ اللهِ وَبِحَمْدِهِ</div>
    <div class="fadl" id="fadl"></div>
    <div class="src" id="src"></div>

    <div class="ring" id="ring">
      <svg width="250" height="250" viewBox="0 0 250 250">
        <circle cx="125" cy="125" r="112" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle id="arc" cx="125" cy="125" r="112" fill="none" stroke="var(--gold)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="703" stroke-dashoffset="703"/>
      </svg>
      <div class="mid">
        <div class="num" id="num">0</div>
        <div class="of" id="of">من ٣٣</div>
        <div class="rounds" id="rounds"></div>
      </div>
    </div>

    <div class="tapzone" id="tapzone">اضغط في أي مكان داخل الدائرة أو هنا للتسبيح</div>

    <div class="targets" id="targets"></div>
    <div class="src">تنبيه: أرقام أهداف العدّاد اختيارية للتنظيم، ولا تُنسب للسنة إلا إذا ذكر المصدر عددًا محددًا.</div>

    <div class="ctrl">
      <button id="b-undo">تراجع −١</button>
      <button id="b-reset">تصفير</button>
      <button id="b-seq">تسبيح ما بعد الصلاة</button>
      <button id="b-awake">إبقاء الشاشة</button>
    </div>
  </div>
</div>

<!-- ============ DHIKR LIST ============ -->
<div id="v-list" class="hide">
  <section>
    <div class="head"><span>الأذكار</span>
      <button class="icon" id="b-add" style="width:32px;height:32px;font-size:18px">＋</button></div>
    <div id="list"></div>
  </section>
</div>

<!-- ============ STATS ============ -->
<div id="v-stats" class="hide">
  <section>
    <div class="head">إحصائياتك</div>
    <div class="stats">
      <div class="stat"><b id="s-today">0</b><span>ذكر اليوم</span></div>
      <div class="stat"><b id="s-total">0</b><span>الإجمالي</span></div>
      <div class="stat"><b id="s-streak">0</b><span>أيام متتابعة</span></div>
      <div class="stat"><b id="s-best">0</b><span>أعلى يوم</span></div>
    </div>
    <div class="week" id="week"></div>
  </section>
  <section>
    <div class="head">توزيع الأذكار اليوم</div>
    <div class="bars" id="bars"></div>
  </section>
  <section>
    <div class="head">البيانات</div>
    <div class="field"><button class="primary" id="b-export">تصدير نسخة احتياطية</button></div>
    <div class="field"><button class="primary" id="b-import" style="background:var(--line);color:var(--ink)">استيراد</button>
      <input type="file" id="file-in" accept="application/json" class="hide"></div>
  </section>
</div>
</div>

<div class="toast" id="toast"></div>

<nav><div>
  <button data-t="count" aria-current="true"><em>◍</em>السبحة</button>
  <button data-t="list"><em>☰</em>الأذكار</button>
  <button data-t="stats"><em>▤</em>إحصائيات</button>
</div></nav>

<!-- add custom dhikr -->
<div class="sheet hide" id="add-sheet"><div class="box">
  <div class="head"><span>إضافة ذكر</span><button class="icon" id="close-add" style="width:32px;height:32px">✕</button></div>
  <div class="field"><label for="new-text">نص الذكر</label><input type="text" id="new-text" placeholder="اكتب الذكر…"></div>
  <div class="field"><label for="new-target">العدد المستهدف</label><input type="number" id="new-target" value="33" min="1"></div>
  <div class="field"><button class="primary" id="save-new">إضافة</button></div>
</div></div>

<script>
/* ================= storage ================= */
const store={
 async get(k){ if(window.storage){try{const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null}catch{return null}}
   const v=localStorage.getItem(k);return v?JSON.parse(v):null },
 async set(k,v){ if(window.storage){try{await window.storage.set(k,JSON.stringify(v),false);return}catch{}}
   localStorage.setItem(k,JSON.stringify(v)) },
 async keys(p){ if(window.storage){try{const r=await window.storage.list(p,false);return r?r.keys:[]}catch{return[]}}
   return Object.keys(localStorage).filter(k=>k.startsWith(p)) }
};

/* ================= data ================= */
const BASE=[
 {id:'sub_hamd',t:'سُبْحَانَ اللهِ وَبِحَمْدِهِ',n:100,f:'من قالها مائة مرة في يومه حُطَّت خطاياه وإن كانت مثل زبد البحر.',src:'حديث أبي هريرة — صحيح؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/10620'},
 {id:'tahlil',t:'لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',n:100,f:'ثبت في الحديث فضل قولها مائة مرة في اليوم.',src:'حديث أبي هريرة — صحيح؛ الدرر السنية',u:'https://dorar.net/h/PgrcNHyQ'},
 {id:'istighfar',t:'أَسْتَغْفِرُ اللهَ وَأَتُوبُ إِلَيْهِ',n:100,f:'ثبت أن النبي ﷺ كان يتوب إلى الله ويستغفره في اليوم مائة مرة.',src:'صحيح الحديث؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/37239'},
 {id:'salat_nabi',t:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ',n:1,f:'من صلى على النبي ﷺ صلاة صلى الله عليه بها عشرًا. لا يحدد رفيق لهذا الذكر عددًا يوميًا مخصوصًا.',src:'صحيح مسلم (408)؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/40098'},
 {id:'hawqala',t:'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ',n:1,f:'ورد أنها كنز من كنوز الجنة. لا يحدد رفيق عددًا مخصوصًا هنا.',src:'حديث صحيح؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/138399'},
 {id:'baqiyat',t:'سُبْحَانَ اللهِ، وَالحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبَرُ',n:1,f:'ثبت أن هذه الكلمات الأربع من أحب الكلام إلى الله. لا يحدد رفيق عددًا مخصوصًا هنا.',src:'صحيح مسلم؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/21255'},
 {id:'sub_bihamdih',t:'سُبْحَانَ اللهِ وَبِحَمْدِهِ، سُبْحَانَ اللهِ العَظِيمِ',n:1,f:'كلمتان حبيبتان إلى الرحمن، خفيفتان على اللسان، ثقيلتان في الميزان.',src:'صحيح البخاري؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/3023'},
 {id:'ya_hayy',t:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ',n:1,f:'دعاء مأثور؛ لا يحدد رفيق له عددًا مخصوصًا في السبحة.',src:'حصن المسلم من أذكار الكتاب والسنة — سعيد بن علي القحطاني',u:'https://islamhouse.com/ar/books/2522/'}
];
const SEQ=[
 {t:'سُبْحَانَ اللهِ',n:33},{t:'الحَمْدُ لِلَّهِ',n:33},{t:'اللهُ أَكْبَرُ',n:33},
 {t:'لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',n:1}
];
const SEQ_SOURCE={src:'تسبيح دبر الصلاة 33، والتحميد 33، والتكبير 33، وتمام المائة بالتهليل — صحيح مسلم؛ الدرر السنية',u:'https://dorar.net/hadith/sharh/62319'};
const TARGETS=[33,99,100,313,1000];

/* ================= state ================= */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const AR=n=>n.toLocaleString('ar-EG');
let cfg={sound:true,vibe:true,theme:'dark',target:100,idx:0},
    custom=[], today={}, count=0, rounds=0, seqIdx=-1, wake=null, tab='count';
const DHIKR=()=>BASE.concat(custom);
const cur=()=> seqIdx>=0 ? SEQ[seqIdx] : DHIKR()[cfg.idx];
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1300)};

/* ---- click sound ---- */
let ac;
function click(hi){ if(!cfg.sound)return;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=hi?880:520; o.type='sine';
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(hi?.28:.09));
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+(hi?.3:.1));
  }catch{} }

/* ================= counter ================= */
function target(){ return seqIdx>=0 ? SEQ[seqIdx].n : (cfg.target||cur().n) }
function paint(){
  const c=cur(), tg=target();
  document.getElementById('zikr').textContent=c.t;
  document.getElementById('fadl').textContent= seqIdx>=0 ? 'تسبيح ما بعد الصلاة — '+(seqIdx+1)+' من ٤' : (c.f||'');
  const sr=seqIdx>=0?SEQ_SOURCE:c;
  document.getElementById('src').innerHTML=sr&&sr.src?`المصدر: ${sr.u?`<a href="${sr.u}" target="_blank" rel="noopener">${sr.src}</a>`:sr.src}`:'هذا نص أضافه المستخدم؛ لا ينسبه رفيق إلى السنة.';
  document.getElementById('num').textContent=AR(count);
  document.getElementById('of').textContent='من '+AR(tg);
  document.getElementById('rounds').textContent= rounds? 'أكملت '+AR(rounds)+' دورة':'';
  const C=703, p=Math.min(1,count/tg);
  document.getElementById('arc').style.strokeDashoffset=C-C*p;
  document.querySelectorAll('#targets button').forEach(b=>
    b.setAttribute('aria-pressed', seqIdx<0 && +b.dataset.n===tg));
  document.getElementById('b-seq').classList.toggle('on',seqIdx>=0);
}
async function bump(){
  count++;
  const id = seqIdx>=0 ? 'seq_'+seqIdx : cur().id;
  today[id]=(today[id]||0)+1;
  if(cfg.vibe&&navigator.vibrate) navigator.vibrate(12);
  const tg=target();
  if(count>=tg){
    click(true); if(cfg.vibe&&navigator.vibrate) navigator.vibrate([28,60,28]);
    if(seqIdx>=0){
      if(seqIdx<SEQ.length-1){ seqIdx++; count=0; toast('انتقلنا للتالي') }
      else { seqIdx=-1; count=0; toast('تمّ تسبيح ما بعد الصلاة — تقبّل الله') }
    } else { rounds++; count=0; toast('اكتملت الدورة — تقبّل الله') }
  } else click(false);
  paint(); saveDay();
}
let sT; function saveDay(){ clearTimeout(sT);
  sT=setTimeout(()=>store.set('tas:'+iso(new Date()),today),300) }

document.getElementById('tapzone').onclick=bump;
document.getElementById('ring').onclick=bump;
document.getElementById('b-undo').onclick=()=>{ if(count>0){count--;
  const id=seqIdx>=0?'seq_'+seqIdx:cur().id; today[id]=Math.max(0,(today[id]||0)-1); paint(); saveDay()} };
document.getElementById('b-reset').onclick=()=>{count=0;rounds=0;paint()};
document.getElementById('b-seq').onclick=()=>{ seqIdx = seqIdx>=0?-1:0; count=0; rounds=0; paint() };
document.getElementById('b-awake').onclick=async e=>{
  try{ if(wake){ await wake.release(); wake=null; e.target.classList.remove('on'); toast('أُلغي إبقاء الشاشة') }
    else { wake=await navigator.wakeLock.request('screen'); e.target.classList.add('on'); toast('الشاشة لن تنطفئ') }
  }catch{ toast('غير مدعوم في هذا المتصفح') } };

const tg=document.getElementById('targets');
tg.innerHTML=TARGETS.map(n=>`<button data-n="${n}">${AR(n)}</button>`).join('');
tg.onclick=async e=>{const b=e.target.closest('button'); if(!b)return;
  seqIdx=-1; cfg.target=+b.dataset.n; count=0; rounds=0; await store.set('tas:cfg',cfg); paint()};

/* ================= dhikr list ================= */
function renderList(){
  const host=document.getElementById('list');
  host.innerHTML=DHIKR().map((d,i)=>
    `<div class="row ${i===cfg.idx&&seqIdx<0?'sel':''}" data-i="${i}">
      <span class="t">${d.t}</span><span class="c">${AR(today[d.id]||0)} · هدف ${AR(d.n)}</span><div class="src">${d.src?`المصدر: ${d.u?`<a href="${d.u}" target="_blank" rel="noopener">${d.src}</a>`:d.src}`:'نص أضافه المستخدم — لا ينسبه رفيق إلى السنة.'}</div></div>`).join('');
  host.onclick=async e=>{ const r=e.target.closest('.row'); if(!r)return;
    cfg.idx=+r.dataset.i; seqIdx=-1; cfg.target=DHIKR()[cfg.idx].n; count=0; rounds=0;
    await store.set('tas:cfg',cfg); paint(); switchTab('count') };
}
document.getElementById('b-add').onclick=()=>document.getElementById('add-sheet').classList.remove('hide');
document.getElementById('close-add').onclick=()=>document.getElementById('add-sheet').classList.add('hide');
document.getElementById('save-new').onclick=async()=>{
  const t=document.getElementById('new-text').value.trim();
  const n=+document.getElementById('new-target').value||33;
  if(!t){toast('اكتب نص الذكر');return}
  custom.push({id:'c'+Date.now(),t,n,f:'',src:''}); await store.set('tas:custom',custom);
  document.getElementById('new-text').value='';
  document.getElementById('add-sheet').classList.add('hide'); renderList(); toast('أُضيف الذكر') };

/* ================= stats ================= */
async function renderStats(){
  const keys=await store.keys('tas:');
  const dayKeys=keys.filter(k=>/^tas:\d{4}-\d{2}-\d{2}$/.test(k)).sort();
  let total=0,best=0; const byDay={};
  for(const k of dayKeys){ const v=await store.get(k)||{};
    const s=Object.values(v).reduce((a,b)=>a+b,0); byDay[k.slice(4)]=s; total+=s; if(s>best)best=s }
  const tSum=Object.values(today).reduce((a,b)=>a+b,0);
  document.getElementById('s-today').textContent=AR(tSum);
  document.getElementById('s-total').textContent=AR(total);
  document.getElementById('s-best').textContent=AR(best);

  let streak=0;
  for(let i=0;;i++){ const d=new Date(); d.setDate(d.getDate()-i);
    const s=byDay[iso(d)]||0;
    if(s>0) streak++; else if(i>0) break; else if(i===0) break }
  document.getElementById('s-streak').textContent=AR(streak);

  const week=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week.push(d)}
  const max=Math.max(1,...week.map(d=>byDay[iso(d)]||0));
  document.getElementById('week').innerHTML=week.map(d=>{
    const v=byDay[iso(d)]||0;
    return `<div><i><b style="height:${Math.round(v/max*100)}%"></b></i>
      ${new Intl.DateTimeFormat('ar-EG',{weekday:'narrow'}).format(d)}</div>`}).join('');

  const entries=Object.entries(today).filter(([,v])=>v>0)
    .sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mx=Math.max(1,...entries.map(e=>e[1]));
  const label=id=>{ if(id.startsWith('seq_')) return SEQ[+id.slice(4)].t.slice(0,18);
    const d=DHIKR().find(x=>x.id===id); return d? d.t.slice(0,18):id };
  document.getElementById('bars').innerHTML= entries.length? entries.map(([id,v])=>
    `<div class="bar"><span>${label(id)}</span><i style="width:${v/mx*100}%"></i><em>${AR(v)}</em></div>`).join('')
    : '<div class="bar"><span style="color:var(--soft)">لم تسبّح اليوم بعد</span><i style="width:0"></i><em></em></div>';
}

/* ================= backup ================= */
document.getElementById('b-export').onclick=async()=>{
  const keys=await store.keys('tas:'); const out={};
  for(const k of keys) out[k]=await store.get(k);
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='tasbih-backup-'+iso(new Date())+'.json'; a.click(); toast('تم التصدير') };
document.getElementById('b-import').onclick=()=>document.getElementById('file-in').click();
document.getElementById('file-in').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{ const j=JSON.parse(await f.text());
    for(const [k,v] of Object.entries(j)) await store.set(k,v);
    await boot(); toast('تم الاستيراد') }catch{ toast('الملف غير صالح') } };

/* ================= tabs & toggles ================= */
const T={count:'السبحة',list:'الأذكار',stats:'إحصائياتك'};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.t));
function switchTab(t){ tab=t;
  ['count','list','stats'].forEach(v=>document.getElementById('v-'+v).classList.toggle('hide',v!==t));
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t));
  document.getElementById('title').textContent=T[t];
  if(t==='list') renderList();
  if(t==='stats') renderStats();
  scrollTo({top:0,behavior:'smooth'}) }

document.getElementById('b-sound').onclick=async e=>{ cfg.sound=!cfg.sound;
  e.target.style.color=cfg.sound?'var(--gold)':''; await store.set('tas:cfg',cfg);
  toast(cfg.sound?'الصوت مفعّل':'الصوت متوقف') };
document.getElementById('b-vibe').onclick=async e=>{ cfg.vibe=!cfg.vibe;
  e.target.style.color=cfg.vibe?'var(--gold)':''; await store.set('tas:cfg',cfg);
  toast(cfg.vibe?'الاهتزاز مفعّل':'الاهتزاز متوقف') };
document.getElementById('b-theme').onclick=async()=>{
  cfg.theme = cfg.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cfg.theme);
  await store.set('tas:cfg',cfg) };

/* keyboard: space / enter to count */
addEventListener('keydown',e=>{ if(tab==='count'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();bump()} });

/* ================= boot ================= */
async function boot(){
  cfg=Object.assign({sound:true,vibe:true,theme:'dark',target:100,idx:0},await store.get('tas:cfg')||{});
  custom=(await store.get('tas:custom'))||[];
  today=(await store.get('tas:'+iso(new Date())))||{};
  document.documentElement.setAttribute('data-theme',cfg.theme);
  document.getElementById('b-sound').style.color=cfg.sound?'var(--gold)':'';
  document.getElementById('b-vibe').style.color=cfg.vibe?'var(--gold)':'';
  if(cfg.idx>=DHIKR().length) cfg.idx=0;
  count=0; rounds=0; seqIdx=-1; paint();
}
boot();
</script>
