name: Tadaruq quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static project validation
        run: python tools/validate_project.py
      - name: JavaScript syntax
        run: bash tools/check_js.sh
      - name: Performance budgets
        run: python tools/check_budgets.py
      - name: First-entry regression
        run: python tests/knowledge_first_render_static.py
      - name: Performance regression
        run: python tests/performance_static.py
      - name: Production-readiness static regression
        run: python tests/production_readiness_static.py
      - name: Install browser test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: python tests/e2e_smoke.py
